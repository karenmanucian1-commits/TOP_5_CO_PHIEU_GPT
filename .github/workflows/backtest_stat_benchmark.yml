name: Backtest Statistical Benchmark
on:
  push:
    paths:
      - "backtest_stat_benchmark.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore stock data
        run: |
          rm -rf stock_cache && mkdir stock_cache
          unzip -q stock_cache_seed.zip -d stock_cache
      - name: Recreate trades
        run: |
          python restore_financial_db.py
          python build_scanner_dataset_v2.py
          python backtest_full_isolated.py
      - name: VNINDEX and statistical audit
        run: python backtest_stat_benchmark.py
