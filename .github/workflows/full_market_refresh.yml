name: TOP5 Full Market Refresh

on:
  workflow_dispatch:

  schedule:
    # 06:00 Viet Nam, Chu Nhat = 23:00 UTC Thu Bay
    - cron: "0 23 * * 6"

permissions:
  contents: write

concurrency:
  group: top5-stock-cache
  cancel-in-progress: false

jobs:
  full-market-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore stock cache
        id: stock-cache
        uses: actions/cache/restore@v4
        with:
          path: stock_cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Bootstrap stock cache from seed
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -d stock_cache ] || [ -z "$(find stock_cache -type f -name '*.csv' -print -quit 2>/dev/null)" ]; then
            echo "No previous GitHub cache found."
            echo "Restoring initial stock cache from stock_cache_seed.zip..."
            mkdir -p stock_cache
            unzip -q stock_cache_seed.zip -d stock_cache
          fi

      - name: Verify stock cache
        run: |
          COUNT=$(find stock_cache -maxdepth 1 -type f -name "*.csv" | wc -l)
          echo "CSV files in stock_cache: $COUNT"
          du -sh stock_cache

          if [ "$COUNT" -lt 687 ]; then
            echo "ERROR: stock_cache is incomplete."
            exit 1
          fi

      - name: Full market refresh
        run: python update_scanner_data.py --full

      - name: Verify refreshed quality universe
        run: |
          COUNT=$(python -c "import pandas as pd; print(len(pd.read_csv('quality_universe.csv')))")
          echo "Quality universe symbols: $COUNT"

          if [ "$COUNT" -lt 100 ]; then
            echo "ERROR: quality_universe.csv looks invalid."
            exit 1
          fi

      - name: Save updated stock cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: stock_cache
          key: stock-cache-${{ github.run_id }}

      - name: Commit refreshed quality universe
        if: success()
        run: |
          git config user.name "TOP5 AI Bot"
          git config user.email "top5-ai-bot@users.noreply.github.com"

          git add quality_universe.csv

          if git diff --cached --quiet; then
            echo "quality_universe.csv has no changes."
          else
            git commit -m "Refresh quality universe"

            git pull --rebase origin main
            git push origin HEAD:main
          fi
