name: TOP 5 Cổ Phiếu Hàng Ngày GPT

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy"
        required: true
        default: "midday"
        type: choice
        options:
          - midday
          - morning

  schedule:
    # 05:00 Viet Nam (UTC+7), Thu 2 - Thu 6
    # = 22:00 UTC ngay hom truoc, Chu Nhat - Thu Nam
    - cron: "0 22 * * 0-4"

    # 11:31 Viet Nam (UTC+7), Thu 2 - Thu 6
    # = 04:31 UTC cung ngay
    - cron: "31 4 * * 1-5"

permissions:
  contents: write

jobs:
  top5-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================
      # STOCK CACHE
      # =========================================================

      - name: Restore stock cache
        id: stock-cache
        uses: actions/cache/restore@v4
        with:
          path: stock_cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Bootstrap stock cache from seed
        if: steps.stock-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -d stock_cache ] || [ -z "$(find stock_cache -type f -name '*.csv' -print -quit 2>/dev/null)" ]; then
            echo "No previous GitHub cache found."
            echo "Restoring initial stock cache from stock_cache_seed.zip..."

            mkdir -p stock_cache
            unzip -q stock_cache_seed.zip -d stock_cache

            echo "Initial cache restored."
          else
            echo "A restored stock cache already exists."
          fi

      - name: Verify stock cache
        run: |
          echo "CSV files in stock_cache:"
          find stock_cache -maxdepth 1 -type f -name "*.csv" | wc -l

          echo "Cache size:"
          du -sh stock_cache

          COUNT=$(find stock_cache -maxdepth 1 -type f -name "*.csv" | wc -l)

          if [ "$COUNT" -lt 687 ]; then
            echo "ERROR: stock_cache is incomplete. Expected at least 687 CSV files."
            exit 1
          fi

      # =========================================================
      # TOP5 PIPELINE
      # =========================================================

      - name: Update market data
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python update_scanner_data.py

      - name: Build scanner dataset
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python build_scanner_dataset_v2.py

      - name: Verify latest completed EOD
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python validate_latest_eod.py

      - name: Scan TOP 5
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python daily_scanner_v2.py

      # Legacy TOP5 forward evaluator disabled.
      # Scanner now emits a 30-stock candidate pool, so the old evaluator no longer
      # represents final eligible buy signals. A new T+5/T+10/T+20 forward test
      # will be added separately after both final decision layers are stable.

      - name: Send TOP 5 to Telegram
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_top5_telegram_pro.py
      - name: Send AI Decision to Telegram
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ai_decision_top5.py

      - name: Restore V2 morning EOD files for midday
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        id: v2-eod-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TOP5_V2_TODAY.csv
            scanner_dataset_v2.csv
          key: v2-eod-files-${{ github.run_id }}
          restore-keys: |
            v2-eod-files-

      - name: Verify V2 morning EOD files for midday
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        run: |
          test -f TOP5_V2_TODAY.csv || { echo "ERROR: No V2 morning TOP5 cache found. Run morning once to seed midday."; exit 1; }
          test -f scanner_dataset_v2.csv || { echo "ERROR: No completed EOD scanner dataset found."; exit 1; }
          echo "V2 completed-EOD files restored for midday."

      - name: Midday Decision - keep morning Frozen V2 TOP5
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python midday_decision_top5.py
      # =========================================================
      # SAVE UPDATED CACHE
      # =========================================================

      - name: Save V2 completed EOD files for midday
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5')) && success() }}
        uses: actions/cache/save@v4
        with:
          path: |
            TOP5_V2_TODAY.csv
            scanner_dataset_v2.csv
          key: v2-eod-files-${{ github.run_id }}

      - name: Save updated stock cache
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5')) && success() }}
        uses: actions/cache/save@v4
        with:
          path: stock_cache
          key: stock-cache-${{ github.run_id }}

      # =========================================================
      # SAVE FORWARD HISTORY
      # =========================================================

      - name: Save TOP5 history to repository
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5')) && success() }}
        run: |
          git config user.name "TOP5 AI Bot"
          git config user.email "top5-ai-bot@users.noreply.github.com"

          git add TOP5_V2_HISTORY.csv

          if git diff --cached --quiet; then
            echo "TOP5 history has no changes."
          else
            git commit -m "Update TOP5 history"

            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # =========================================================
      # TOP5 ADVANCED V3.7
      # Runs only AFTER Frozen V2 has completed and been persisted.
      # Frozen V2 files/logic above are unchanged.
      # =========================================================

      - name: Restore V3 morning TOP for midday
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        id: v3-top-cache
        uses: actions/cache/restore@v4
        with:
          path: TOP5_ADVANCED_V3.csv
          key: v3-eod-top-${{ github.run_id }}
          restore-keys: |
            v3-eod-top-

      - name: Verify V3 morning TOP exists for midday
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        run: |
          test -f TOP5_ADVANCED_V3.csv || { echo "ERROR: No V3 morning EOD TOP cache found. Stop V3 midday; Frozen V2 already completed."; exit 1; }
          echo "V3 morning EOD TOP restored:"
          cat TOP5_ADVANCED_V3.csv

      - name: Restore V3 financial database
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python restore_financial_db.py

      - name: Run V3.7 Morning - after V2
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python run_top5_advanced_v3_7.py morning

      - name: Capture Forward Test BUY signals
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: python forward_test.py capture morning

      - name: Persist Forward Test BUY ledger
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5') }}
        run: |
          git config user.name "Forward Test Bot"
          git config user.email "forward-test-bot@users.noreply.github.com"
          git add FORWARD_SIGNALS.csv
          if git diff --cached --quiet; then
            echo "Forward signal ledger has no changes."
          else
            git commit -m "Update Forward Test BUY signals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Save V3 morning TOP for midday
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'morning') || (github.event_name == 'schedule' && github.event.schedule != '31 4 * * 1-5')) && success() }}
        uses: actions/cache/save@v4
        with:
          path: TOP5_ADVANCED_V3.csv
          key: v3-eod-top-${{ github.run_id }}

      - name: Run V3.7 Midday realtime - after V2
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python run_top5_advanced_v3_7.py midday

      - name: Capture Forward Test midday signals
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        run: python forward_test.py capture midday

      - name: Persist Forward Test midday ledger
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 4 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'midday') }}
        run: |
          git config user.name "Forward Test Bot"
          git config user.email "forward-test-bot@users.noreply.github.com"
          git add FORWARD_SIGNALS.csv
          if git diff --cached --quiet; then
            echo "Forward midday ledger has no changes."
          else
            git commit -m "Update Forward Test midday signals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi


# manual morning rerun 2026-10-27 after EOD freshness fix
