name: RECOVER EOD 28-10 ONCE
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recover:
    if: contains(github.event.head_commit.message, '[RECOVER-EOD]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore stock cache
        uses: actions/cache/restore@v4
        with:
          path: stock_cache
          key: recover-stock-${{ github.run_id }}
          restore-keys: |
            stock-cache-
      - name: Force clean EOD 28-10
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          cutoff=pd.Timestamp("2026-10-28")
          n=0
          for f in Path("stock_cache").glob("*.csv"):
              d=pd.read_csv(f)
              if "time" not in d: continue
              t=pd.to_datetime(d["time"],errors="coerce")
              d=d[t<=cutoff].copy()
              d.to_csv(f,index=False)
              n+=1
          print("EOD files clipped to 2026-10-28:",n)
          PY
      - name: Build clean V2 EOD
        run: |
          python build_scanner_dataset_v2.py
          python daily_scanner_v2.py
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("TOP5_V2_TODAY.csv")
          got=pd.to_datetime(d["date"]).max().date()
          print("RECOVERED V2 EOD:",got,"rows:",len(d))
          assert str(got)=="2026-10-28"
          PY
      - name: Restore financial DB
        run: python restore_financial_db.py
      - name: Build clean V3 EOD without Telegram
        run: |
          python daily_valuation_v3.py
          python financial_score_v3.py
          python technical_engine_v3.py
          python entry_engine_v3_4.py
          python candidate_gate_v3_5.py
          python top5_advanced_v3.py
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("TOP5_ADVANCED_V3.csv")
          print("RECOVERED V3 rows:",len(d))
          print(d.head(10).to_string(index=False))
          PY
      - name: Save clean V2 EOD
        uses: actions/cache/save@v4
        with:
          path: |
            TOP5_V2_TODAY.csv
            scanner_dataset_v2.csv
          key: v2-eod-files-clean-2026-10-28
      - name: Save clean V3 EOD
        uses: actions/cache/save@v4
        with:
          path: TOP5_ADVANCED_V3.csv
          key: v3-eod-top-clean-2026-10-28
