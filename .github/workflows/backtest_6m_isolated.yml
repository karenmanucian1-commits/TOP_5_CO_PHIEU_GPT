name: Backtest 6M Isolated
on:
  push:
    paths:
      - "backtest_6m_isolated.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Restore latest production cache read-only copy
        id: stock-cache
        uses: actions/cache/restore@v4
        with:
          path: stock_cache
          key: backtest-read-${{ github.run_id }}
          restore-keys: |
            stock-cache-
      - name: Seed only if cache unavailable
        if: ${{ steps.stock-cache.outputs['cache-matched-key'] == '' }}
        run: |
          rm -rf stock_cache
          mkdir stock_cache
          unzip -q stock_cache_seed.zip -d stock_cache
      - name: Verify stock data
        run: echo "stock files: $(find stock_cache -name '*.csv' | wc -l)"
      - name: Restore financial DB
        run: python restore_financial_db.py
      - name: Build historical scanner
        run: python build_scanner_dataset_v2.py
      - name: Run isolated six-month backtest
        run: python backtest_6m_isolated.py
      - name: Persist backtest outputs only
        run: |
          git config user.name "Backtest Bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add BACKTEST_6M_SUMMARY.csv BACKTEST_6M_TRADES.csv BACKTEST_6M_AUDIT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save isolated 6M backtest results"
          git pull --rebase origin main
          git push origin HEAD:main
