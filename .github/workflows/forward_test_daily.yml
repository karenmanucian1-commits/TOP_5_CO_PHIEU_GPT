name: Forward Test - Chứng Khoán GPT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/forward_test_daily.yml]
  schedule:
    # 18:00 Viet Nam (UTC+7), Monday-Friday — corrected Forward Test v2
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Evaluate T1-T20, upload Drive, notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GDRIVE_WEBHOOK: ${{ secrets.GDRIVE_WEBHOOK }}
        run: python forward_test.py report

      - name: Persist Forward Test results
        if: success()
        run: |
          git config user.name "Forward Test Bot"
          git config user.email "forward-test-bot@users.noreply.github.com"
          git add FORWARD_RESULTS.csv
          if git diff --cached --quiet; then
            echo "Forward results have no changes."
          else
            git commit -m "Update Forward Test T1-T20 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
