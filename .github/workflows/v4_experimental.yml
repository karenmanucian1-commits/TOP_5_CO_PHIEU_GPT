name: V4 Experimental Research
on:
  push:
    branches: [v4-experimental]
    paths:
      - "v4_research.py"
      - ".github/workflows/v4_experimental.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-experimental
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore isolated historical stock data
        run: |
          rm -rf stock_cache && mkdir stock_cache
          unzip -q stock_cache_seed.zip -d stock_cache
          echo "Files: $(find stock_cache -name '*.csv' | wc -l)"
      - name: Optimize Development, lock V4, then evaluate Holdout
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python v4_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-experimental-result
          path: v4_result.json
          if-no-files-found: ignore
